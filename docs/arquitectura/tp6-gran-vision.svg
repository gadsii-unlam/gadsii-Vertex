<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 884" width="1400" height="884" font-family="Helvetica, Arial, sans-serif">
  <defs>
    <marker id="f" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#1f2933"/></marker>
    <style>
      .t{font-size:15px;font-weight:700;fill:#1f2933}
      .d{font-size:12.5px;fill:#3e4c59}
      .m{font-size:12px;font-weight:700}
      .mv{fill:#1f7a4d}
      .mp{fill:#9a6212}
      .capa{font-size:12px;font-weight:700;fill:#52606d;letter-spacing:.06em}
      .no{fill:#fff;stroke:#7b8794;stroke-width:1.4}
      .si{fill:#e3f4ea;stroke:#1f7a4d;stroke-width:2}
      .pre{fill:#fff6e0;stroke:#b7791f;stroke-width:1.6;stroke-dasharray:6 4}
      .per{fill:#eaf0fb;stroke:#3b5bab;stroke-width:1.4}
      .banda{fill:#f4f5f7;stroke:#d5d9df}
      .fl{stroke:#1f2933;stroke-width:1.6;fill:none}
      .fla{stroke:#1f2933;stroke-width:1.6;fill:none;stroke-dasharray:6 4}
      .et{font-size:12px;font-style:italic;fill:#1f2933}
    </style>
  </defs>
  <rect width="1400" height="884" fill="#ffffff"/>

  <text x="40" y="40" font-size="24" font-weight="700" fill="#1f2933">Arquitectura de la gran visión de UNLaM Carpool</text>
  <text x="40" y="64" class="d">El producto completo del TP1. El color de cada parte indica cuánto de ella ya cubre el MVP.</text>

  <!-- Personas -->
  <text x="40" y="104" class="capa">PERSONAS</text>
  <rect x="40" y="118" width="190" height="56" rx="28" class="per"/><text x="135" y="151" class="t" text-anchor="middle">Estudiante pasajero</text>
  <rect x="40" y="298" width="190" height="56" rx="28" class="per"/><text x="135" y="331" class="t" text-anchor="middle">Estudiante conductor</text>
  <rect x="40" y="478" width="190" height="56" rx="28" class="per"/><text x="135" y="505" class="t" text-anchor="middle">Equipo de</text><text x="135" y="523" class="t" text-anchor="middle">UNLaM Carpool</text>

  <!-- Clientes -->
  <rect x="262" y="88" width="270" height="480" rx="8" class="banda"/>
  <text x="276" y="108" class="capa">EN EL CELULAR O LA WEB</text>
  <rect x="276" y="118" width="242" height="96" rx="6" class="si"/>
  <text x="290" y="142" class="t">App del pasajero</text>
  <text x="290" y="162" class="d">Buscar, pedir lugar, cancelar,</text><text x="290" y="178" class="d">calificar y recibir avisos</text>
  <text x="290" y="202" class="m mv">MVP: construida, sin calificar ni avisos</text>
  <rect x="276" y="282" width="242" height="96" rx="6" class="no"/>
  <text x="290" y="306" class="t">App del conductor</text>
  <text x="290" y="326" class="d">Publicar viajes, aceptar o</text><text x="290" y="342" class="d">rechazar pedidos y calificar</text>
  <text x="290" y="366" class="m" fill="#52606d">MVP: no existe</text>
  <rect x="276" y="458" width="242" height="96" rx="6" class="no"/>
  <text x="290" y="482" class="t">Panel de administración</text>
  <text x="290" y="502" class="d">Revisar certificados, licencias</text><text x="290" y="518" class="d">y seguros; atender reportes</text>
  <text x="290" y="542" class="m" fill="#52606d">MVP: no existe</text>
  <line class="fl" x1="230" y1="146" x2="274" y2="146" marker-end="url(#f)"/>
  <line class="fl" x1="230" y1="326" x2="274" y2="326" marker-end="url(#f)"/>
  <line class="fl" x1="230" y1="506" x2="274" y2="506" marker-end="url(#f)"/>

  <!-- Servidor -->
  <rect x="580" y="88" width="560" height="480" rx="8" class="banda"/>
  <text x="594" y="108" class="capa">SERVIDOR DE APLICACIÓN (MÓDULOS DE UN MISMO BACKEND)</text>
  <line class="fl" x1="532" y1="300" x2="578" y2="300" marker-end="url(#f)"/>
  <text x="536" y="290" class="et">API</text>

  <rect x="594" y="118" width="262" height="100" rx="6" class="pre"/>
  <text x="608" y="142" class="t">Identidad y verificación</text>
  <text x="608" y="162" class="d">Correo institucional, código y</text><text x="608" y="178" class="d">certificado de alumno regular</text>
  <text x="608" y="204" class="m mp">MVP: automática, en el navegador</text>
  <rect x="864" y="118" width="262" height="100" rx="6" class="no"/>
  <text x="878" y="142" class="t">Verificación de conductores</text>
  <text x="878" y="162" class="d">Licencia, seguro y datos</text><text x="878" y="178" class="d">del vehículo</text>
  <text x="878" y="204" class="m" fill="#52606d">MVP: no existe</text>

  <rect x="594" y="230" width="262" height="100" rx="6" class="pre"/>
  <text x="608" y="254" class="t">Publicación de viajes</text>
  <text x="608" y="274" class="d">Origen, destino, horario, lugares,</text><text x="608" y="290" class="d">tipo de recorrido y costo</text>
  <text x="608" y="316" class="m mp">MVP: 26 viajes precargados</text>
  <rect x="864" y="230" width="262" height="100" rx="6" class="si" stroke-width="3.2"/>
  <text x="878" y="254" class="t">★ Búsqueda y matching</text>
  <text x="878" y="274" class="d">Recorrido, horario y cursada</text><text x="878" y="290" class="d">compartida (componente propio)</text>
  <text x="878" y="316" class="m mv">MVP: construido, por localidad</text>

  <rect x="594" y="342" width="262" height="100" rx="6" class="si"/>
  <text x="608" y="366" class="t">Solicitudes</text>
  <text x="608" y="386" class="d">Pedir, aceptar, rechazar y</text><text x="608" y="402" class="d">cancelar un lugar</text>
  <text x="608" y="428" class="m mv">MVP: construido; acepta solo</text>
  <rect x="864" y="342" width="262" height="100" rx="6" class="pre"/>
  <text x="878" y="366" class="t">Cursada</text>
  <text x="878" y="386" class="d">Materias, comisiones y turnos</text><text x="878" y="402" class="d">de cada estudiante</text>
  <text x="878" y="428" class="m mp">MVP: catálogo precargado</text>

  <rect x="594" y="454" width="262" height="100" rx="6" class="pre"/>
  <text x="608" y="478" class="t">Reputación e historial</text>
  <text x="608" y="498" class="d">Calificaciones y comentarios</text><text x="608" y="514" class="d">después de cada viaje</text>
  <text x="608" y="540" class="m mp">MVP: referencias precargadas</text>
  <rect x="864" y="454" width="262" height="100" rx="6" class="no"/>
  <text x="878" y="478" class="t">Avisos</text>
  <text x="878" y="498" class="d">Pedidos, aceptaciones,</text><text x="878" y="514" class="d">cancelaciones y cambios</text>
  <text x="878" y="540" class="m" fill="#52606d">MVP: no existe</text>

  <!-- Datos -->
  <rect x="1180" y="88" width="190" height="480" rx="8" class="banda"/>
  <text x="1194" y="108" class="capa">DATOS</text>
  <line class="fl" x1="1140" y1="300" x2="1178" y2="300" marker-end="url(#f)"/>
  <rect x="1194" y="118" width="162" height="200" rx="6" class="no"/>
  <text x="1208" y="142" class="t">Base de datos</text>
  <text x="1208" y="162" class="t">compartida</text>
  <text x="1208" y="186" class="d">Usuarios, cursadas,</text><text x="1208" y="202" class="d">vehículos, viajes,</text><text x="1208" y="218" class="d">solicitudes y</text><text x="1208" y="234" class="d">calificaciones</text>
  <text x="1208" y="264" class="m" fill="#52606d">MVP: no existe;</text><text x="1208" y="280" class="m" fill="#52606d">cada navegador</text><text x="1208" y="296" class="m" fill="#52606d">guarda su copia</text>
  <rect x="1194" y="334" width="162" height="220" rx="6" class="no"/>
  <text x="1208" y="358" class="t">Archivos</text>
  <text x="1208" y="378" class="t">privados</text>
  <text x="1208" y="402" class="d">Certificados,</text><text x="1208" y="418" class="d">licencias y seguros,</text><text x="1208" y="434" class="d">con acceso</text><text x="1208" y="450" class="d">restringido</text>
  <text x="1208" y="480" class="m" fill="#52606d">MVP: el archivo</text><text x="1208" y="496" class="m" fill="#52606d">no se guarda</text>

  <!-- Externos -->
  <rect x="262" y="600" width="1108" height="170" rx="8" class="banda"/>
  <text x="276" y="622" class="capa">SERVICIOS EXTERNOS</text>
  <line class="fl" x1="860" y1="568" x2="860" y2="598" marker-end="url(#f)"/>
  <text x="868" y="590" class="et">el servidor los usa</text>
  <rect x="276" y="634" width="206" height="122" rx="6" class="pre"/>
  <text x="290" y="658" class="t">SIU Guaraní (UNLaM)</text>
  <text x="290" y="678" class="d">Alumno regular y cursada</text>
  <text x="290" y="742" class="m mp">MVP: certificado y lista</text>
  <rect x="494" y="634" width="206" height="122" rx="6" class="pre"/>
  <text x="508" y="658" class="t">Correo institucional</text>
  <text x="508" y="678" class="d">Envío del código de acceso</text>
  <text x="508" y="742" class="m mp">MVP: código en pantalla</text>
  <rect x="712" y="634" width="206" height="122" rx="6" class="pre"/>
  <text x="726" y="658" class="t">Mapas</text>
  <text x="726" y="678" class="d">Ubicaciones y punto</text><text x="726" y="694" class="d">de encuentro</text>
  <text x="726" y="742" class="m mp">MVP: 14 localidades</text>
  <rect x="930" y="634" width="206" height="122" rx="6" class="no"/>
  <text x="944" y="658" class="t">Cálculo de rutas</text>
  <text x="944" y="678" class="d">Comparar recorridos</text><text x="944" y="694" class="d">para el matching</text>
  <text x="944" y="742" class="m" fill="#52606d">MVP: no existe</text>
  <rect x="1148" y="634" width="208" height="122" rx="6" class="no"/>
  <text x="1162" y="658" class="t">Notificaciones push</text>
  <text x="1162" y="678" class="d">Entregar los avisos</text><text x="1162" y="694" class="d">en el celular</text>
  <text x="1162" y="742" class="m" fill="#52606d">MVP: no existe</text>


  <!-- Dónde está el MVP -->
  <rect x="40" y="600" width="200" height="170" rx="8" fill="#e3f4ea" stroke="#1f7a4d" stroke-width="1.6" stroke-dasharray="6 4"/>
  <text x="54" y="624" class="t">Dónde está el MVP</text>
  <text x="54" y="646" class="d">Cubre al pasajero de</text>
  <text x="54" y="662" class="d">punta a punta, pero todo</text>
  <text x="54" y="678" class="d">corre en un navegador:</text>
  <text x="54" y="694" class="d">sin servidor, sin base de</text>
  <text x="54" y="710" class="d">datos y sin servicios</text>
  <text x="54" y="726" class="d">externos. No tiene lado</text>
  <text x="54" y="742" class="d">del conductor ni panel.</text>

  <!-- Leyenda -->
  <rect x="40" y="800" width="1330" height="64" rx="8" fill="#fff" stroke="#d5d9df"/>
  <rect x="58" y="816" width="40" height="20" rx="4" class="si"/><text x="106" y="831" class="d">Construido en el MVP</text>
  <rect x="270" y="816" width="40" height="20" rx="4" class="pre"/><text x="318" y="831" class="d">Precargado o automático en el MVP</text>
  <rect x="566" y="816" width="40" height="20" rx="4" class="no"/><text x="614" y="831" class="d">No existe en el MVP</text>
  <rect x="776" y="816" width="40" height="20" rx="14" class="per"/><text x="824" y="831" class="d">Personas</text>
  <line class="fl" x1="920" y1="826" x2="970" y2="826" marker-end="url(#f)"/><text x="978" y="831" class="d">Usa a</text>
  <text x="58" y="854" class="d">★ Componente propio del TP1. Los módulos del servidor son partes lógicas de un mismo backend, no servicios separados.</text>
</svg>
